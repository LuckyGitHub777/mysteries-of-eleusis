name: Local Eleusis Browser Safety

on:
  pull_request:
    paths:
      - index.html
      - app.js
      - styles.css
      - tests/browser_smoke.py
      - .github/workflows/browser-smoke.yml
  push:
    branches: [main]
    paths:
      - index.html
      - app.js
      - styles.css
      - tests/browser_smoke.py
      - .github/workflows/browser-smoke.yml

permissions:
  contents: read

concurrency:
  group: eleusis-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source without persisting credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Install Chromium for local-only smoke
        run: |
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Run desktop/mobile interaction and input-escaping regression
        run: python tests/browser_smoke.py
