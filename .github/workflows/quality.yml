name: Static quality
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: JavaScript syntax
        run: node --check app.js
      - name: Static site quality
        run: python3 tests/static_verify.py
